---
# Playbook principal. Cada fase añade aquí su rol.

- name: Configuración común de todos los nodos
  hosts: all
  become: true
  roles:
    - common

# Orden de arranque: primero el NameNode (masters), después los DataNodes (workers).
- name: HDFS - NameNode
  hosts: masters
  become: true
  roles:
    - hdfs

- name: HDFS - DataNodes
  hosts: workers
  become: true
  roles:
    - hdfs

- name: HDFS - Verificación del clúster
  hosts: masters
  become: true
  tasks:
    - name: Comprobar que HDFS tiene todos los DataNodes y replicación 2
      ansible.builtin.include_role:
        name: hdfs
        tasks_from: verify

# Spark: primero el Master, después los Workers (necesitan al Master arrancado).
- name: Spark - Master
  hosts: masters
  become: true
  roles:
    - spark

- name: Spark - Workers
  hosts: workers
  become: true
  roles:
    - spark

- name: Spark - Verificación del clúster
  hosts: masters
  become: true
  tasks:
    - name: Comprobar que Spark tiene todos los workers
      ansible.builtin.include_role:
        name: spark
        tasks_from: verify
