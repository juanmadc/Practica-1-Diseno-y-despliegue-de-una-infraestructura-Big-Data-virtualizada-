---
- name: Crear los directorios de configuración y de jobs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ spark_conf_dir }}"
    - "{{ spark_jobs_dir }}"

- name: Generar spark-defaults.conf
  ansible.builtin.template:
    src: spark-defaults.conf.j2
    dest: "{{ spark_conf_dir }}/spark-defaults.conf"
    mode: "0644"
  notify: Reiniciar contenedor Spark

- name: Generar metrics.properties para exponer metricas en Prometheus
  ansible.builtin.copy:
    dest: "{{ spark_conf_dir }}/metrics.properties"
    mode: "0644"
    content: |
      *.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
      *.sink.prometheusServlet.path=/metrics/prometheus
      master.sink.prometheusServlet.path=/metrics/master/prometheus
      applications.sink.prometheusServlet.path=/metrics/applications/prometheus
  notify: Reiniciar contenedor Spark

- name: Copiar el job de ejemplo (contador de palabras)
  ansible.builtin.copy:
    src: wordcount.py
    dest: "{{ spark_jobs_dir }}/wordcount.py"
    mode: "0644"

- name: Arrancar el contenedor Spark Master
  community.docker.docker_container:
    name: spark-master
    image: "{{ spark_image }}"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - "{{ spark_master_host }}"
      - --port
      - "{{ spark_master_port }}"
      - --webui-port
      - "{{ spark_master_webui_port }}"
      - --properties-file
      - /opt/spark/conf/spark-defaults.conf
    state: started
    recreate: true
    restart_policy: unless-stopped
    network_mode: host
    env:
      SPARK_DAEMON_MEMORY: "{{ spark_daemon_memory }}"
      JAVA_TOOL_OPTIONS: >-
        -Dspark.ui.prometheus.enabled=true
        -Dspark.metrics.conf=/opt/spark/conf/metrics.properties
        -Dspark.metrics.conf.*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
        -Dspark.metrics.conf.*.sink.prometheusServlet.path=/metrics/prometheus
        -Dspark.metrics.conf.master.sink.prometheusServlet.path=/metrics/master/prometheus
        -Dspark.metrics.conf.applications.sink.prometheusServlet.path=/metrics/applications/prometheus
      HADOOP_USER_NAME: hadoop
    volumes:
      - "{{ spark_conf_dir }}/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro"
      - "{{ spark_conf_dir }}/metrics.properties:/opt/spark/conf/metrics.properties:ro"
      - "{{ spark_jobs_dir }}:/jobs:ro"

- name: Esperar a que el Spark Master acepte conexiones (RPC y web)
  ansible.builtin.wait_for:
    host: "{{ spark_master_host }}"
    port: "{{ item }}"
    timeout: 180
  loop:
    - "{{ spark_master_port }}"
    - "{{ spark_master_webui_port }}"