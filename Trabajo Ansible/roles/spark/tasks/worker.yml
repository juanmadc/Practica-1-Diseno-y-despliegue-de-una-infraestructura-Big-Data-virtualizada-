---
- name: Crear el directorio de configuración de Spark en el worker
  ansible.builtin.file:
    path: "{{ spark_conf_dir }}"
    state: directory
    mode: "0755"

- name: Generar metrics.properties en el worker para Prometheus
  ansible.builtin.copy:
    dest: "{{ spark_conf_dir }}/metrics.properties"
    mode: "0644"
    content: |
      *.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
      *.sink.prometheusServlet.path=/metrics/prometheus
      master.sink.prometheusServlet.path=/metrics/master/prometheus
      applications.sink.prometheusServlet.path=/metrics/applications/prometheus
  notify: Reiniciar contenedor Spark

- name: Arrancar el contenedor Spark Worker
  community.docker.docker_container:
    name: spark-worker
    image: "{{ spark_image }}"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - "{{ spark_master_url }}"
      - --host
      - "{{ ip_privada }}"
      - --webui-port
      - "{{ spark_worker_webui_port }}"
      - --cores
      - "{{ spark_worker_cores }}"
      - --memory
      - "{{ spark_worker_memory }}"
      - --work-dir
      - /opt/spark/work-dir
    state: started
    recreate: true
    restart_policy: unless-stopped
    network_mode: host
    env:
      SPARK_DAEMON_MEMORY: "{{ spark_daemon_memory }}"
      JAVA_TOOL_OPTIONS: >-
        -Dspark.ui.prometheus.enabled=true
        -Dspark.metrics.conf=/opt/spark/conf/metrics.properties
        -Dspark.metrics.conf.*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
        -Dspark.metrics.conf.*.sink.prometheusServlet.path=/metrics/prometheus
      HADOOP_USER_NAME: hadoop
    volumes:
      - "{{ spark_conf_dir }}/metrics.properties:/opt/spark/conf/metrics.properties:ro"
